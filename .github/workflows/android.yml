name: APK Android

# Fabrique l'APK de test du studio local (interface + harnais d'agent en WebView,
# inférence native llama.cpp via le plugin llama-cpp-capacitor).
#
# Pourquoi ici et pas en local : la chaîne Android (JDK + SDK + NDK) pèse
# plusieurs Go. Le build tourne donc sur les serveurs GitHub ; l'appli, elle,
# s'exécute intégralement sur le téléphone — aucune partie du fonctionnement
# n'est en ligne.
#
# L'APK produit est un APK **debug** : il s'installe directement sur un appareil
# (sources inconnues autorisées), sans clé de signature à gérer.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 8 demande Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Le plugin compile llama.cpp en natif : il faut la chaîne NDK. La version
      # installée ici est volontairement générique ; si Gradle en réclame une
      # précise, son message d'erreur la nomme et il suffira de l'ajuster.
      - name: Chaîne NDK
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Dépendances
        run: npm ci

      - name: Build statique de l'interface
        run: npm run build:spa

      - name: Copier l'interface dans le projet Android
        run: npx cap sync android

      # Le modèle GGUF n'est PLUS embarqué dans l'APK. Il a été retiré parce que
      # le plugin llama-cpp-capacitor ne cherche le modèle que dans le système de
      # fichiers (getFilesDir()/Documents, getExternalFilesDir(null)/Documents,
      # /sdcard/Documents, …) et n'a AUCUN chemin d'assets : un GGUF posé dans
      # les assets de l'APK était donc introuvable, d'où l'erreur « Failed to
      # initialize native context ». Les 398 Mo embarqués ne servaient à rien et
      # gonflaient l'APK ; il redescend à ~19 Mo. Le modèle est désormais
      # téléchargé par l'appli au premier lancement dans getFilesDir()/Documents
      # (voir src/ai/modeleLocal.ts), dossier que le plugin visite réellement.
      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-local-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
