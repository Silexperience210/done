name: APK Android

# Fabrique l'APK de test du studio local (interface + harnais d'agent en WebView,
# inférence native llama.cpp via le plugin llama-cpp-capacitor).
#
# Pourquoi ici et pas en local : la chaîne Android (JDK + SDK + NDK) pèse
# plusieurs Go. Le build tourne donc sur les serveurs GitHub ; l'appli, elle,
# s'exécute intégralement sur le téléphone — aucune partie du fonctionnement
# n'est en ligne.
#
# L'APK produit est un APK **debug** : il s'installe directement sur un appareil
# (sources inconnues autorisées), sans clé de signature à gérer.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 8 demande Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # Le plugin compile llama.cpp en natif : il faut la chaîne NDK. La version
      # installée ici est volontairement générique ; si Gradle en réclame une
      # précise, son message d'erreur la nomme et il suffira de l'ajuster.
      - name: Chaîne NDK
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1" || true

      - name: Dépendances
        run: npm ci

      - name: Build statique de l'interface
        run: npm run build:spa

      - name: Copier l'interface dans le projet Android
        run: npx cap sync android

      # Embarquer le modèle GGUF DANS l'APK plutôt que de le faire télécharger par
      # l'appli à la première ouverture : l'inférence native (llama.cpp via le
      # plugin llama-cpp-capacitor) doit fonctionner dès le premier lancement,
      # sans dépendre d'une connexion réseau ni d'un tiers (Hugging Face) qui
      # pourrait être indisponible, lent, ou changer la licence/le fichier.
      # Le modèle voyage ainsi dans les assets : l'appli est autonome hors-ligne.
      - name: Embarquer le modèle GGUF dans l'APK
        run: |
          set -euo pipefail
          ASSETS_DIR="android/app/src/main/assets"
          MODEL_NAME="Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf"
          MODEL_URL="https://huggingface.co/bartowski/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-0.5B-Instruct-Q4_K_M.gguf"
          mkdir -p "$ASSETS_DIR"

          # Idempotent : on ne retélécharge pas un modèle déjà présent (utile en
          # cache de workflow et pour ne pas gaspiller ~400 Mo de bande passante).
          if [ -s "$ASSETS_DIR/$MODEL_NAME" ]; then
            echo "Modèle déjà présent, téléchargement ignoré."
          else
            echo "Téléchargement de $MODEL_NAME (~398 Mo)..."
            curl -L --fail --retry 3 --no-progress-meter \
              -o "$ASSETS_DIR/$MODEL_NAME" "$MODEL_URL"
          fi

          # Échouer tôt si le fichier manque ou fait 0 octet, plutôt que de
          # produire un APK silencieusement dépourvu de modèle.
          test -s "$ASSETS_DIR/$MODEL_NAME"
          ls -la "$ASSETS_DIR/$MODEL_NAME"

      - name: Compiler l'APK de test
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: studio-local-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
